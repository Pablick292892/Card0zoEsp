name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "$THEOS/bin" >> $GITHUB_PATH
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        brew install ldid

    - name: Unzip Dobby
      run: |
        # Распаковываем загруженный ZIP с правильным именем
        unzip -q Dobby-master.zip
        # Переименовываем папку для удобства
        mv Dobby-master Dobby
        
    - name: Build
      run: make TARGET=iphone:clang:latest:14.0 ARCHS=arm64
      
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Card0zoESP
        path: .theos/obj/debug/Card0zoESP.dylib
