name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "$THEOS/bin" >> $GITHUB_PATH
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        brew install ldid

    - name: Download ImGui
      run: |
        curl -L https://github.com/ocornut/imgui/archive/refs/heads/master.zip -o imgui.zip
        unzip -q imgui.zip
        mv imgui-master ImGui

    - name: Download Titanox
      run: |
        curl -L https://github.com/Ragekill3377/Titanox/archive/refs/heads/main.zip -o titanox.zip
        unzip -q titanox.zip
        # Создаем папку libtitanox и копируем туда всё содержимое Titanox-main
        mkdir -p libtitanox
        cp -R Titanox-main/* libtitanox/

    - name: Build Tweak
      run: |
        make TARGET=iphone:clang:latest:14.0 ARCHS=arm64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Card0zoESP-dylib
        path: .theos/obj/debug/Card0zoESP.dylib
