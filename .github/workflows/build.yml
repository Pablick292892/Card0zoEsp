name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "$THEOS/bin" >> $GITHUB_PATH
        echo "THEOS=$THEOS" >> $GITHUB_ENV

    - name: Build Tweak
      env:
        KEYAUTH_APPNAME: ${{ secrets.KEYAUTH_APPNAME }}
        KEYAUTH_OWNERID: ${{ secrets.KEYAUTH_OWNERID }}
      run: |
        make package FINALPACKAGE=1 TARGET=iphone:clang:latest:14.0 ARCHS=arm64

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Card0zoESP-dylib
        path: .theos/obj/debug/Card0zoESP.dylib
