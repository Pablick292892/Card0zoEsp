name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "$THEOS/bin" >> $GITHUB_PATH
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        brew install ldid
    - name: Download ImGui
      run: |
        curl -L https://github.com/ocornut/imgui/archive/refs/heads/master.zip -o imgui.zip
        unzip -q imgui.zip
        mv imgui-master ImGui
    - name: Build
      run: make TARGET=iphone:clang:latest:14.0 ARCHS=arm64
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Card0zoESP
        path: .theos/obj/debug/Card0zoESP.dylib
