name: Analyze libloader

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-15 # <-- Убедись, что тут 15, а не 14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Analyze binary
      run: |
        BIN=$(find . -name "libloader" -type f | head -n 1)
        echo "Analyzing: $BIN"
        
        # Смотрим, какие библиотеки он грузит (зависимости)
        echo "=== Linked Libraries ==="
        otool -L "$BIN"
        
        # Вытаскиваем все импортируемые символы, даже если nm не видит
        echo "=== Dyld Info ==="
        otool -Iv "$BIN" | head -n 200
        
        # Ищем конкретно системные вызовы (добавил || true, чтобы не падало)
        echo "=== Suspicious Calls ==="
        otool -Iv "$BIN" | grep -iE "sysctl|ptrace|mach_vm|vm_|dyld|task_|csops" || echo "Nothing found"
