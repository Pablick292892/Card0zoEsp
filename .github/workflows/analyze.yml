name: Deep Analyze libloader

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Analyze binary
      run: |
        BIN=$(find . -name "libloader" -type f | head -n 1)
        echo "Analyzing: $BIN"
        
        echo "=== STRINGS (Тексты) ==="
        # Ищем все, что связано с ошибками, проверками и памятью
        strings "$BIN" | grep -iE "927|6072|security|threat|memory|vm_|ptrace|integrity|checksum|jailbreak|simulator|frida|substrate|hook|inject|library" | head -n 100
        
        echo "=== MACH-O HEADER ==="
        otool -hv "$BIN"
