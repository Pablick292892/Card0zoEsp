name: Find Error Writes

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  find:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find Str Commands
      run: |
        # Дизассемблируем оригинальный libloader (он должен лежать в репо)
        otool -tv libloader > disasm_full.txt
        
        # Ищем все места, где идет запись в память (str) с регистром w8
        # и выводим 3 строки до и 3 после, чтобы видеть, какой код туда пишется
        grep -n -B 3 -A 3 "str.*w8, \[x23\]" disasm_full.txt > error_writes.txt || echo "Not found"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: error-writes
        path: error_writes.txt
