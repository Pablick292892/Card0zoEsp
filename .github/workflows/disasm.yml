name: Extract and Search

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Disassemble and Search
      run: |
        # Дизассемблируем
        otool -tv libloader > disasm.txt
        
        # Ищем нужные функции
        echo "=== Searching ===" > results.txt
        grep -i -n -B 2 -A 2 -E "dlsym|csops|mach_vm" disasm.txt >> results.txt || echo "Not found"
        
        # Вырезаем кусок от 0x4100 до 0x5000 для декомпиляции
        dd if=libloader of=chunk.bin bs=1 skip=16640 count=3840

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: search-and-chunk
        path: |
          results.txt
          chunk.bin
