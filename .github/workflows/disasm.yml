name: Full Anti-Cheat Analysis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Analyze
      run: |
        echo "=== 2. STRINGS (Все строки в бинарнике) ==="
        strings libloader > strings.txt
        
        echo "=== 3. DISASSEMBLY ==="
        otool -tv libloader > disasm.txt
        
        echo "=== 4. MACH VM AND SYSCTL CALLS ==="
        # Добавили || true, чтобы не крашилось, если не найдет
        grep -n -i "mach_vm" disasm.txt > mach_vm.txt || true
        grep -n -i "sysctl" disasm.txt > sysctl.txt || true
        
        echo "Done!"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: full-analysis
        path: |
          strings.txt
          mach_vm.txt
          sysctl.txt
