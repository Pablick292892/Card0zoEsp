name: Extract Hex around check

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract
      run: |
        # Адрес проверки в файле (в десятичном виде для dd)
        # 0x0447c = 17532
        # Вытаскиваем 32 байта начиная с 0x04470
        dd if=libloader of=hex_dump.bin bs=1 skip=$((0x04470)) count=32
        
        # Переводим в hex
        xxd hex_dump.bin > hex_dump.txt

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: hex-data
        path: hex_dump.txt
