name: Full Hex Dump

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Hex Dump
      run: |
        # Переводим весь файл в HEX-формат (текстом) и сохраняем
        xxd libloader > full_hex.txt

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: hex-dump-file
        path: full_hex.txt
