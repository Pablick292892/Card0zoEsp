name: Find Csops Calls

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  find:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find Imports
      run: |
        # Ищем в строках бинарника упоминания csops, fstat, mmap
        echo "=== Searching for csops/fstat/mmap ===" > search_results.txt
        strings libloader | grep -iE "csops|fstat|mmap|sysctl" >> search_results.txt || echo "Not found in strings"
        
        # Ищем в таблице символов (если есть)
        echo "=== Symbols ===" >> search_results.txt
        nm -u libloader | grep -iE "csops|fstat|mmap|sysctl" >> search_results.txt || echo "Not found in symbols"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: search-results
        path: search_results.txt
