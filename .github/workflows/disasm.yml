name: Extract Readable Code

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Analyze
      run: |
        # Дизассемблируем (на случай, если disasm.txt нет)
        otool -tv libloader > disasm_full.txt
        
        echo "=== 1. Точка входа и главный диспетчер (0x04100 - 0x04500) ===" > readable_code.txt
        # Вытаскиваем кусок кода от 0x04100 до 0x04500 (там наши проверки)
        awk '/0000000000004100/,/0000000000004550/' disasm_full.txt >> readable_code.txt
        
        echo "" >> readable_code.txt
        echo "=== 2. Проверки флагов и хуков ===" >> readable_code.txt
        # Ищем все места, где проверяются биты (tst) и переходы (cbz/cbnz)
        grep -n -B 2 -A 2 "tst" disasm_full.txt >> readable_code.txt || true
        grep -n -B 2 -A 2 "cbz" disasm_full.txt >> readable_code.txt || true

        echo "" >> readable_code.txt
        echo "=== 3. Вызовы функций (bl) ===" >> readable_code.txt
        # Ищем все вызовы функций (bl) в первой части
        awk '/0000000000004100/,/0000000000004550/' disasm_full.txt | grep "bl" >> readable_code.txt || true

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: readable-code
        path: readable_code.txt
