name: Deep Function Analysis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Analyze
      run: |
        # Дизассемблируем
        otool -tv libloader > disasm.txt
        
        echo "=== 1. Call to dlsym (динамический поиск) ==="
        grep -n -B 2 -A 2 "dlsym" disasm.txt > dlsym_calls.txt || true
        
        echo "=== 2. Call to dlopen (загрузка библиотек) ==="
        grep -n -B 2 -A 2 "dlopen" disasm.txt > dlopen_calls.txt || true
        
        echo "=== 3. Call to sysctl/mach_vm (попытка) ==="
        grep -n -B 2 -A 2 "sysctl\|mach_vm" disasm.txt > system_calls.txt || true
        
        echo "Done!"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deep-analysis
        path: |
          dlsym_calls.txt
          dlopen_calls.txt
          system_calls.txt
