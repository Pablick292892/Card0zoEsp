name: Full Code Analysis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Analyze
      run: |
        # 1. Генерируем дизассемблер
        otool -tv libloader > disasm.txt
        
        # 2. Вытаскиваем все вызовы системных функций, которые нам нужны
        # Ищем вызовы (bl) и системные регистры (x0, x1 и т.д.) для проверок
        echo "=== MEMORY & DEBUG CHECKS ===" > results.txt
        grep -n -B 2 -A 2 -iE "mach_vm|sysctl|ptrace|task_info|vm_protect|csops" disasm.txt >> results.txt || true
        
        # 3. Вытаскиваем все места, где он грузит строки (adrp x0 + add x0)
        echo "=== STRINGS LOADING ===" >> results.txt
        grep -n -B 2 -A 2 "adrp x0" disasm.txt | head -n 500 >> results.txt || true
        
        # 4. Вытаскиваем все места, где он проверяет флаги (cbz, cbnz, cmp, tst)
        echo "=== BRANCH CHECKS ===" >> results.txt
        grep -n -B 2 -A 2 -iE "cbz|cbnz|tst" disasm.txt | head -n 500 >> results.txt || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: full-analysis-results
        path: results.txt
