name: Disassemble Patched File

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  disasm:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find Offsets
      run: |
        # Просто дизассемблируем файл
        otool -tv libloader > disasm.txt

    - name: Upload Disassembly
      uses: actions/upload-artifact@v4
      with:
        name: disasm-log
        path: disasm.txt
